<div class="buscador-contenedor">
  <div class="buscador-caja">
    <span class="icono-buscar">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
      </svg>
    </span>
    <input type="text" class="campo" placeholder="Buscar por nombre de la bebida" aria-label="Buscar por nombre"
      [(ngModel)]="nombre" (keyup.enter)="onBuscarNombre()">
    <button type="button" class="boton-buscar" (click)="onBuscarNombre()">Buscar</button>
  </div>
</div>
<div class="buscador-contenedor">
  <div class="buscador-caja">
    <span class="icono-buscar">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
      </svg>
    </span>
    <input type="text" class="campo" placeholder="Buscar por ingrediente de la bebida" aria-label="Buscar por ingrediente"
      [(ngModel)]="ingrediente" (keyup.enter)="onBuscarIngrediente()">
    <button type="button" class="boton-buscar" (click)="onBuscarIngrediente()">Buscar</button>
  </div>
</div>
<div class="buscador-contenedor">
  <div class="buscador-caja">
    <select class="campo" (change)="onFiltrarTipo($any($event.target).value)">
      <option value="">Todos los tipos</option>
      <option value="Alcoholic">Alcohólica</option>
      <option value="Non alcoholic">Sin alcohol</option>
    </select>
  </div>
</div>
<div class="buscador-contenedor">
  <div class="buscador-caja">
    <select class="campo" (change)="onFiltrarCategoria($any($event.target).value)">
      <option value="">Todas las categorías</option>
      <option value="Ordinary Drink">Bebida ordinaria</option>
      <option value="Cocktail">Coctel</option>
    </select>
  </div>
</div>
